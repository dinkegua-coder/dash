<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard</title>
  <style>
    :root {
      --bg-color: #EFECE6;        /* 暖米白背景 */
      --card-bg: #F7F5F0;         /* 卡片淺色 */
      --text-main: #333A33;       /* 深綠/墨黑文字 */
      --text-sub: #666C63;        /* 鼠尾草灰文字 */
      --accent-green: #4A5D4E;    /* 山系橄欖綠 */
      --accent-brown: #8C6D53;    /* 大地棕 */
      --accent-light: #D8E0D5;    /* 淺綠 */
      --border-color: #D3CEC5;    /* 邊框色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
    }

    /* 全螢幕 3 等分佈局 */
    body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 上部分：時鐘 (佔 1/3 高度) */
    header {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 24px;
      border-radius: 16px;
      border: 2px solid var(--border-color);
      min-height: 0;
    }

    .time-display {
      font-size: clamp(3.5rem, 8vh, 7.5rem);
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-green);
      line-height: 1;
    }

    .date-display {
      font-size: clamp(1.2rem, 3vh, 1.8rem);
      font-weight: 700;
      color: var(--accent-brown);
    }

    /* 中部分 & 下部分 (佔 2/3 高度，分為上下兩排格仔) */
    main {
      flex: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      min-height: 0;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 2px solid var(--border-color);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .card-compact {
      padding: 6px 10px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-green);
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 3px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    /* 1. 天氣樣式 */
    .weather-temp-box {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 4px;
    }

    .weather-temp {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-brown);
      line-height: 1;
    }

    .weather-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--accent-light);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .weather-forecast {
      font-size: 0.72rem;
      color: var(--text-sub);
      line-height: 1.2;
      overflow-y: auto;
      flex: 1;
    }

    /* 2. 紅日倒數樣式 */
    .holiday-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .holiday-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: #FFFFFF;
      padding: 6px 10px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-brown);
    }

    .holiday-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .holiday-days {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--accent-brown);
      line-height: 1;
    }

    .holiday-tip {
      background: var(--accent-light);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-green);
      margin-top: 4px;
    }

    /* 3. 今日備忘 (To-Do List) 樣式 */
    .todo-input-group {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .todo-input {
      flex: 1;
      padding: 4px 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.75rem;
      outline: none;
      background: #FFF;
      color: var(--text-main);
    }

    .todo-btn {
      background: var(--accent-green);
      color: #FFF;
      border: none;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
    }

    .todo-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .todo-item.completed span {
      text-decoration: line-through;
      color: var(--text-sub);
      opacity: 0.6;
    }

    .todo-item span {
      flex: 1;
      word-break: break-all;
    }

    .todo-item input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--accent-green);
    }

    .todo-del-btn {
      border: none;
      background: transparent;
      color: #C62828;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <!-- 頂部 1/3：時鐘區 -->
  <header>
    <div>
      <div class="date-display" id="date">--</div>
    </div>
    <div class="time-display" id="clock">00:00:00</div>
  </header>

  <!-- 中部與底部 2/3：四個卡片區 -->
  <main>
    <!-- 中部左：天氣卡片 -->
    <section class="card">
      <div class="card-title">⛰️ 灣仔即時天氣</div>
      <div class="weather-temp-box">
        <div class="weather-temp" id="temp">--°C</div>
      </div>
      <div class="weather-info-grid">
        <div>相對濕度：<span id="humidity">--</span>%</div>
        <div>地區：灣仔</div>
      </div>
      <div class="weather-forecast" id="forecast">
        正在載入天氣數據...
      </div>
    </section>

    <!-- 中部右：紅日倒數卡片 -->
    <section class="card">
      <div class="card-title">🗓️ 下一個紅日</div>
      <div class="holiday-container">
        <div class="holiday-main">
          <div>
            <div class="holiday-name" id="holiday-name">載入中...</div>
            <div style="font-size: 0.72rem; color: var(--text-sub);" id="holiday-date">--</div>
          </div>
          <div>
            <span class="holiday-days" id="holiday-days">--</span>
            <span style="font-size: 0.8rem; font-weight: 700;"> 天</span>
          </div>
        </div>
        <div class="holiday-tip" id="holiday-tip">💡 請假攻略載入中...</div>
      </div>
    </section>

    <!-- 底部左：今日備忘 / 待辦事項 (替代原本美股 ETF) -->
    <section class="card card-compact">
      <div class="card-title">📝 今日備忘 / 待辦事項</div>
      <div class="todo-input-group">
        <input type="text" id="todo-input" class="todo-input" placeholder="輸入事項後按 Enter..." onkeydown="if(event.key==='Enter') addTodo()">
        <button onclick="addTodo()" class="todo-btn">新增</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
    </section>

    <!-- 底部右：專注計時器 -->
    <section class="card card-compact">
      <div class="card-title">⏱️ 專注計時器</div>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex: 1; justify-content: center;">
        <div id="timer-display" style="font-size: 1.5rem; font-weight: 800; color: #4A5D4E; line-height: 1;">25:00</div>
        <div style="display: flex; width: 100%; gap: 4px; margin-top: 4px;">
          <button onclick="startTimer(5)" style="flex: 1; background: #4A5D4E; color: #FFF; border: none; padding: 5px 0; font-size: 0.65rem; font-weight: 700; border-radius: 4px; cursor: pointer;">5m</button>
          <button onclick="startTimer(10)" style="flex: 1; background: #4A5D4E; color: #FFF; border: none; padding: 5px 0; font-size: 0.65rem; font-weight: 700; border-radius: 4px; cursor: pointer;">10m</button>
          <button onclick="startTimer(15)" style="flex: 1; background: #4A5D4E; color: #FFF; border: none; padding: 5px 0; font-size: 0.65rem; font-weight: 700; border-radius: 4px; cursor: pointer;">15m</button>
          <button onclick="startTimer(25)" style="flex: 1; background: #4A5D4E; color: #FFF; border: none; padding: 5px 0; font-size: 0.65rem; font-weight: 700; border-radius: 4px; cursor: pointer;">25m</button>
          <button onclick="resetTimer()" style="flex: 1; background: #8C6D53; color: #FFF; border: none; padding: 5px 0; font-size: 0.65rem; font-weight: 700; border-radius: 4px; cursor: pointer;">重置</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    /* 1. 時鐘邏輯 */
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('date').textContent = `${year}年${month}月${date}日 ${days[now.getDay()]}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* 2. 天氣邏輯 */
    async function fetchWeather() {
      try {
        const resRHRREAD = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const dataRHRREAD = await resRHRREAD.json();
        
        const wanChaiTemp = dataRHRREAD.temperature.data.find(item => item.place === '灣仔');
        document.getElementById('temp').textContent = wanChaiTemp ? `${wanChaiTemp.value}°C` : `${dataRHRREAD.temperature.data[0].value}°C`;

        if (dataRHRREAD.humidity && dataRHRREAD.humidity.data.length > 0) {
          document.getElementById('humidity').textContent = dataRHRREAD.humidity.data[0].value;
        }

        const resFLW = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc');
        const dataFLW = await resFLW.json();
        document.getElementById('forecast').textContent = dataFLW.forecastDesc || '暫無預測數據';
      } catch (err) {
        document.getElementById('forecast').textContent = '天氣數據載入失敗';
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    /* 3. 紅日倒數邏輯 */
    const holidays = [
      { name: '中秋節後第二日', date: '2026-09-26', tip: '💡 請 1 放 4 (請 9/25 即可連休4天)' },
      { name: '國慶日', date: '2026-10-01', tip: '💡 請 1 放 4 (請 10/2 即可連休4天)' },
      { name: '重陽節', date: '2026-10-18', tip: '💡 週末連假不需要請假！' },
      { name: '聖誕節', date: '2026-12-25', tip: '💡 請 4 放 10 (請 12/28-31 爽放跨年大假)' }
    ];

    function calculateHoliday() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const nextHoliday = holidays.find(h => new Date(h.date) >= today) || holidays[0];
      const targetDate = new Date(nextHoliday.date);
      const diffDays = Math.ceil((targetDate - today) / (1000 * 60 * 60 * 24));

      document.getElementById('holiday-name').textContent = nextHoliday.name;
      document.getElementById('holiday-date').textContent = nextHoliday.date;
      document.getElementById('holiday-days').textContent = diffDays;
      document.getElementById('holiday-tip').textContent = nextHoliday.tip;
    }
    calculateHoliday();

    /* 4. 今日備忘 / 待辦事項邏輯 (LocalStorage) */
    let todos = JSON.parse(localStorage.getItem('dashboard_todos') || '[]');

    function saveAndRenderTodos() {
      localStorage.setItem('dashboard_todos', JSON.stringify(todos));
      const listEl = document.getElementById('todo-list');
      listEl.innerHTML = '';

      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${index})">
          <span>${todo.text}</span>
          <button class="todo-del-btn" onclick="deleteTodo(${index})">×</button>
        `;
        listEl.appendChild(li);
      });
    }

    function addTodo() {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (text) {
        todos.push({ text: text, completed: false });
        input.value = '';
        saveAndRenderTodos();
      }
    }

    function toggleTodo(index) {
      todos[index].completed = !todos[index].completed;
      saveAndRenderTodos();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      saveAndRenderTodos();
    }

    // 初始化渲染備忘事項
    saveAndRenderTodos();

    /* 5. 計時器邏輯 */
    let timerInterval = null;
    let timeLeft = 1500;

    function updateTimerDisplay() {
      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
    }

    function startTimer(minutes) {
      clearInterval(timerInterval);
      timeLeft = minutes * 60;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          alert('⏰ 夠鐘！');
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timeLeft = 1500;
      updateTimerDisplay();
    }
  </script>
</body>
</html>
